server:
  port: 8080

disruptor:
  lifecycle-phase: -100
  shutdown-timeout: 10s
  defaults:
    buffer-size: 1024
    wait-strategy: YIELDING
  pipelines:
    matching:
      producer-type: SINGLE

  concurrent:
    lifecycle-phase: -200
    shutdown-timeout: 10s

logging:
  level:
    com.sstlfsj.disruptor.tutorial: INFO    # 主干 accept/match/emit 为 INFO；看撮合明细/metrics 可临时改 DEBUG
